[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-maze-ing"
version = "0.1.0"
description = "A maze generator, exporter, and terminal visualizer."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = [
	"a_maze_ing",
	"config_parser",
	"output_writer",
	"visualizer",
]

[tool.setuptools.packages.find]
include = ["maze_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
